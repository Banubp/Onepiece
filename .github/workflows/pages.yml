name: Validate live portfolio source

on:
  push:
    branches: [main, gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required portfolio files
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js
          grep -q '<canvas width="140" height="140"' index.html
      - name: Check internal asset references
        run: |
          grep -q 'class="hero-mascot"' index.html
          grep -q 'assets/projects/nexa/nexa-duo-transparent.png' index.html
          grep -q 'assets/projects/booking/booking-macbook.webp' index.html
          grep -q 'nexa-duo-transparent.png' case-studies/nexa.html
          grep -q 'nexa-splash-transparent.png' case-studies/nexa.html
          ! grep -q 'assets/projects/nexa/home.png' case-studies/nexa.html
          ! grep -q 'assets/projects/nexa/safe-to-spend.png' case-studies/nexa.html
          ! grep -q 'assets/projects/nexa/ai-coach.png' case-studies/nexa.html
          grep -q 'class="echo-home-workflow"' index.html
          grep -q 'class="echo-architecture"' case-studies/echo.html
          grep -q 'class="echo-learning-cycle"' case-studies/echo.html
          grep -q 'class="echo-authority-graph"' case-studies/echo.html
          grep -q 'class="spine-home-board"' index.html
          grep -q 'class="hero-mockup spine-audit-lab"' case-studies/spine.html
          grep -q 'class="spine-forge-flow"' case-studies/spine.html
          grep -q 'class="spine-decision-path"' case-studies/spine.html
          grep -q 'class="spine-learning-loop"' case-studies/spine.html
          grep -q '<h2>Audit output</h2>' case-studies/spine.html
          grep -q '<h2>Learning architecture</h2>' case-studies/spine.html
          ! grep -q 'Completion +19%' case-studies/spine.html
          ! grep -q 'Failed predictions' case-studies/spine.html
          test "$(grep -o 'class="case-card ' index.html | wc -l)" -eq 4
          test "$(grep -o 'class="project-tile' index.html | wc -l)" -eq 6
