name: Validate live portfolio source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required portfolio files
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s assets/mascot-banu.svg
      - name: Check internal asset references
        run: |
          grep -q 'class="hero-mascot"' index.html
          grep -q 'assets/projects/nexa/home.png' index.html
          grep -q 'assets/projects/booking/explorer-home.jpg' index.html
          test "$(grep -o 'class="case-card' index.html | wc -l)" -eq 4
          test "$(grep -o 'class="project-tile' index.html | wc -l)" -eq 6
